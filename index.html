<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8f5367"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="css/style.css">
<title>BeautyBook</title>
</head>
<body>
<div class="app">
<header><div class="brand"><span>✦</span><div><b>BeautyBook</b><small>Beauty appointments made simple</small></div></div><button onclick="toggleTheme()">☼</button></header>
<section class="hero"><div><p>FREELANCE BEAUTY</p><h1>Book your<br><i>beauty time.</i></h1><span>Choose a service, pick a date and send a booking request. Your appointment is confirmed after acceptance.</span></div><strong>✿</strong></section>
<div class="tabs"><button class="active" onclick="tab('book',this)">Book appointment</button><button onclick="tab('owner',this)">Owner</button></div>
<section id="book">
<div class="card"><label>01 · CHOOSE A SERVICE</label><div id="services" class="services"></div></div>
<div class="card"><label>02 · CHOOSE A DATE & TIME</label><input id="date" type="date"><div id="slots" class="slots"></div></div>
<div class="card"><label>03 · YOUR DETAILS</label><input id="name" placeholder="Full name"><input id="phone" placeholder="Phone / WhatsApp"><textarea id="notes" placeholder="Notes or preferences"></textarea><button class="primary" onclick="requestBooking()">Request booking →</button><small class="hint">Your request is not confirmed until the owner accepts it.</small></div>
</section>
<section id="owner" class="hidden"><div class="card"><label>OWNER DASHBOARD</label><div id="login"><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button class="primary" onclick="login()">Sign in →</button></div><div id="dash" class="hidden"><div class="stats"><div><b id="pending">0</b><small>Pending</small></div><div><b id="confirmed">0</b><small>Confirmed</small></div></div><h2>Booking requests</h2><div id="requests"></div><button onclick="logout()">Sign out</button></div></div></section>
</div>
<div id="toast"></div><script type="module" src="js/app.js"></script>
</body></html>
